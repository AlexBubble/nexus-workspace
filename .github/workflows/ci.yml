name: Nexus CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexus_user
          POSTGRES_PASSWORD: nexus_password
          POSTGRES_DB: nexus_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://nexus_user:nexus_password@localhost:5432/nexus_db?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_test_jwt_secret_key_minimum_32_characters_long
      COOKIE_SECRET: ci_test_cookie_secret_key_minimum_32_characters_long
      FRONTEND_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared types & run Prisma migrations
        run: |
          pnpm --filter @nexus/types build
          pnpm --filter @nexus/api db:generate
          pnpm --filter @nexus/api exec prisma db push

      - name: Build entire monorepo
        run: pnpm build

      - name: Run Integration Tests
        run: pnpm --filter @nexus/api test